[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-compromise"
version = "0.1.0"
description = "麦麦不将就：麦当劳点餐最小妥协协商引擎（约束模型、候选生成、妥协排序、报价状态管理）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcd-minimal-compromise contributors" }]
keywords = ["mcdonalds", "mcp", "meal-planning", "constraint-solving"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
# 首版计算引擎仅依赖标准库；pytest 仅为开发依赖
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcd-plan = "mcd_compromise.plan_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
